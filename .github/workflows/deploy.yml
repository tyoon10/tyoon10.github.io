name: Deploy Astro Site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Same permissions / concurrency / Pages source as the legacy Hugo workflow,
# so the repository's Pages settings (source = GitHub Actions, custom domain)
# require no change.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npm run build
      # v4 onward drops dotfiles from the artifact silently. dist/ has none
      # today; if it ever needs one (a .nojekyll, say), add
      # include-hidden-files: true here or it will go missing without an error.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
