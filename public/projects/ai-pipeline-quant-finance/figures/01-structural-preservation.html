<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fig 01 — Structural preservation under ingestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.003 80);
    --bg-sub: oklch(0.965 0.004 80);
    --paper: #ffffff;
    --paper-edge: oklch(0.88 0.005 80);
    --fg: oklch(0.18 0.01 270);
    --fg-muted: oklch(0.46 0.006 270);
    --fg-faint: oklch(0.62 0.005 270);
    --hairline: oklch(0.86 0.005 80);
    --hairline-strong: oklch(0.74 0.006 80);
    --bleached: oklch(0.86 0.004 80);
    --bleached-mid: oklch(0.74 0.004 80);
    --bleached-deep: oklch(0.58 0.005 80);

    /* Element-coded palette */
    --c-hier:  oklch(0.58 0.16 28);
    --c-tab:   oklch(0.58 0.11 200);
    --c-cite:  oklch(0.55 0.14 268);
    --c-meta:  oklch(0.62 0.10 132);

    --c-hier-soft: oklch(0.58 0.16 28 / 0.14);
    --c-tab-soft:  oklch(0.58 0.11 200 / 0.14);
    --c-cite-soft: oklch(0.55 0.14 268 / 0.16);
    --c-meta-soft: oklch(0.62 0.10 132 / 0.16);

    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: oklch(0.16 0.008 270);
    --bg-sub: oklch(0.20 0.008 270);
    --paper: oklch(0.215 0.008 270);
    --paper-edge: oklch(0.32 0.008 270);
    --fg: oklch(0.96 0.003 80);
    --fg-muted: oklch(0.70 0.005 80);
    --fg-faint: oklch(0.48 0.005 80);
    --hairline: oklch(0.28 0.008 270);
    --hairline-strong: oklch(0.42 0.008 270);
    --bleached: oklch(0.34 0.005 270);
    --bleached-mid: oklch(0.44 0.005 270);
    --bleached-deep: oklch(0.58 0.005 270);

    --c-hier:  oklch(0.72 0.17 28);
    --c-tab:   oklch(0.72 0.11 200);
    --c-cite:  oklch(0.70 0.14 268);
    --c-meta:  oklch(0.76 0.10 132);

    --c-hier-soft: oklch(0.72 0.17 28 / 0.22);
    --c-tab-soft:  oklch(0.72 0.11 200 / 0.18);
    --c-cite-soft: oklch(0.70 0.14 268 / 0.22);
    --c-meta-soft: oklch(0.76 0.10 132 / 0.20);
  }

  html, body { margin: 0; background: var(--bg-sub); color: var(--fg); font-family: var(--sans); }

  .review { display: flex; flex-direction: column; gap: 0; }
  .variant { padding: 28px clamp(20px, 4vw, 64px) 48px; background: var(--bg); border-bottom: 1px solid var(--hairline); }
  .variant-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
  .variant-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-hier); display: inline-block; }
  .variant-head .meta { color: var(--fg-faint); margin-left: auto; }
  .figure-wrap { border: 1px solid var(--hairline); background: var(--bg); max-width: 1600px; }
  svg.fig { width: 100%; height: auto; display: block; }

  .fig .paper-bg     { fill: var(--paper); stroke: var(--paper-edge); }
  .fig .paper-shadow { fill: color-mix(in srgb, var(--fg) 9%, transparent); }
  .fig .hair         { stroke: var(--hairline); }
  .fig .hair-s       { stroke: var(--hairline-strong); }
  .fig .ink          { fill: var(--fg); }
  .fig .ink-muted    { fill: var(--fg-muted); }
  .fig .ink-faint    { fill: var(--fg-faint); }

  .fig .c-hier-f { fill: var(--c-hier); }
  .fig .c-hier-s { stroke: var(--c-hier); }
  .fig .c-hier-soft { fill: var(--c-hier-soft); }
  .fig .c-tab-f  { fill: var(--c-tab); }
  .fig .c-tab-s  { stroke: var(--c-tab); }
  .fig .c-tab-soft { fill: var(--c-tab-soft); }
  .fig .c-cite-f { fill: var(--c-cite); }
  .fig .c-cite-s { stroke: var(--c-cite); }
  .fig .c-cite-soft { fill: var(--c-cite-soft); }
  .fig .c-meta-f { fill: var(--c-meta); }
  .fig .c-meta-s { stroke: var(--c-meta); }
  .fig .c-meta-soft { fill: var(--c-meta-soft); }

  .fig .bleach     { fill: var(--bleached); }
  .fig .bleach-mid { fill: var(--bleached-mid); }
  .fig .bleach-deep{ fill: var(--bleached-deep); }

  /* Type — mobile-readable floor is 22px native */
  .fig text { font-family: var(--mono); fill: var(--fg); }
  .fig .t-title   { font-family: var(--mono); font-size: 32px; letter-spacing: 0.04em; fill: var(--fg); font-weight: 500; }
  .fig .t-header  { font-family: var(--mono); font-size: 30px; letter-spacing: 0.04em; fill: var(--fg); font-weight: 500; }
  .fig .t-section { font-family: var(--mono); font-size: 24px; letter-spacing: 0.02em; fill: var(--fg); font-weight: 500; }
  .fig .t-anno    { font-family: var(--mono); font-size: 26px; fill: var(--fg-muted); }
  .fig .t-anno-strong { font-family: var(--mono); font-size: 26px; fill: var(--fg); font-weight: 500; }
  .fig .t-meta    { font-family: var(--mono); font-size: 22px; fill: var(--fg); }
  .fig .t-cap     { font-family: var(--mono); font-size: 22px; letter-spacing: 0.08em; fill: var(--fg-muted); text-transform: uppercase; }
  .fig .t-cite    { font-family: var(--mono); font-size: 20px; fill: var(--c-cite); font-weight: 500; }
  .fig .t-body-bar { fill: color-mix(in srgb, var(--fg) 26%, transparent); }

  .fig .col-divider { stroke: var(--hairline); stroke-dasharray: 3 5; }
  .fig .arrow-quiet { stroke: var(--hairline-strong); fill: none; }
  .fig .arrow-loud  { stroke: var(--c-hier); fill: none; }

  .fig .edge-dense   { stroke: color-mix(in srgb, var(--fg) 36%, transparent); stroke-width: 1.2; fill: none; }
  .fig .edge-clean   { stroke-width: 1.8; fill: none; }
  .fig .node         { stroke-width: 1.2; }

  /* In-article iframe overrides */
  html, body { background: var(--bg); }
  body.variant { padding: 0; border-bottom: 0; }
  .figure-wrap { border: 0; max-width: none; }
  svg.fig { width: 100%; height: auto; display: block; }
</style>
</head>
<body id="figure-host" class="variant">
  <div class="figure-wrap" id="wrap"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, children = []) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  }
  return n;
};
const text = (x, y, str, cls, extra = {}) => el('text', { x, y, class: cls, ...extra }, str);

/* ============================================================
   LEFT — the paper (the structured source)
   ============================================================ */
function buildPaper() {
  const g = el('g', { transform: 'translate(50, 100)' });
  const W = 430, H = 700;

  g.appendChild(el('rect', { x: 8, y: 10, width: W, height: H, rx: 2, class: 'paper-shadow' }));
  g.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, rx: 2, class: 'paper-bg', 'stroke-width': 1 }));

  // Title bars
  g.appendChild(el('rect', { x: 28, y: 36, width: 320, height: 22, fill: 'currentColor', class: 'ink', opacity: 0.88 }));
  g.appendChild(el('rect', { x: 28, y: 66, width: 220, height: 12, fill: 'currentColor', class: 'ink', opacity: 0.45 }));

  // -- Sections (hierarchy)
  let y = 130;
  const drawSection = (indent, code, title, lineWidths, cite = null) => {
    const x = 28 + indent;
    g.appendChild(el('rect', { x, y: y - 22, width: 8, height: 30, class: 'c-hier-f' }));
    g.appendChild(text(x + 18, y, `§ ${code}  ${title}`, 't-section'));
    let ly = y + 26;
    for (const w of lineWidths) {
      g.appendChild(el('rect', { x: x + 18, y: ly, width: w, height: 7, rx: 1, class: 't-body-bar' }));
      ly += 16;
    }
    if (cite) {
      const px = x + 18 + cite.afterW + 8;
      const py = ly - 26;
      g.appendChild(el('rect', { x: px, y: py, width: 48, height: 26, rx: 8, class: 'c-cite-soft' }));
      g.appendChild(text(px + 24, py + 19, cite.n, 't-cite', { 'text-anchor': 'middle' }));
    }
    return ly + 18;
  };

  y = drawSection(0,  '1',   'INTRODUCTION', [300, 260, 200]);
  y = drawSection(22, '1.1', 'Hypothesis',   [220, 180], { afterW: 180, n: '[12]' });
  y = drawSection(0,  '2',   'RESULTS',      [260, 220], { afterW: 220, n: '[27]' });

  // -- TABLE (single, larger)
  const tx = 28, ty = y + 8, tw = 374, th = 130;
  g.appendChild(text(tx, ty - 8, 'TABLE · FACTOR × HORIZON', 't-cap', { fill: 'var(--c-tab)' }));
  g.appendChild(el('rect', { x: tx, y: ty, width: tw, height: th, fill: 'none', class: 'c-tab-s', 'stroke-width': 1.4 }));
  g.appendChild(el('rect', { x: tx, y: ty, width: tw, height: 22, class: 'c-tab-soft' }));
  // grid
  const cols = 4, rows = 3, cw = tw / cols, rh = (th - 22) / rows;
  for (let i = 1; i < cols; i++) {
    g.appendChild(el('line', { x1: tx + i * cw, y1: ty, x2: tx + i * cw, y2: ty + th, class: 'c-tab-s', 'stroke-width': 1, opacity: 0.55 }));
  }
  for (let i = 1; i < rows; i++) {
    g.appendChild(el('line', { x1: tx, y1: ty + 22 + i * rh, x2: tx + tw, y2: ty + 22 + i * rh, class: 'c-tab-s', 'stroke-width': 1, opacity: 0.45 }));
  }
  g.appendChild(el('line', { x1: tx, y1: ty + 22, x2: tx + tw, y2: ty + 22, class: 'c-tab-s', 'stroke-width': 1.2 }));
  // header glyphs
  for (let c = 0; c < cols; c++) {
    g.appendChild(el('rect', { x: tx + c * cw + 8, y: ty + 8, width: cw - 16, height: 6, rx: 1, class: 'c-tab-f', opacity: 0.7 }));
  }
  // body glyphs
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      g.appendChild(el('rect', { x: tx + c * cw + 10, y: ty + 22 + r * rh + (rh - 5) / 2, width: cw - 20, height: 5, rx: 1, class: 'ink', opacity: 0.26 }));
    }
  }
  // highlights + arrow
  const cell = (r, c) => ({ x: tx + c * cw, y: ty + 22 + r * rh, w: cw, h: rh });
  const h1 = cell(0, 1), h2 = cell(1, 2);
  g.appendChild(el('rect', { x: h1.x, y: h1.y, width: h1.w, height: h1.h, class: 'c-tab-soft' }));
  g.appendChild(el('rect', { x: h2.x, y: h2.y, width: h2.w, height: h2.h, class: 'c-tab-soft' }));
  g.appendChild(el('path', {
    d: `M ${h1.x + h1.w / 2} ${h1.y + h1.h / 2} L ${h2.x + h2.w / 2} ${h2.y + h2.h / 2}`,
    class: 'c-tab-s', 'stroke-width': 1.6, fill: 'none', 'marker-end': 'url(#arrow-tab)',
  }));

  y = ty + th + 36;

  // -- METADATA pills
  g.appendChild(text(28, y, 'METADATA', 't-cap', { fill: 'var(--c-meta)' }));
  const pills = ['LIN ET AL.  ·  MIT SLOAN', 'CITED 412×  ·  2023'];
  for (let i = 0; i < pills.length; i++) {
    const py = y + 14 + i * 48;
    g.appendChild(el('rect', { x: 28, y: py, width: 374, height: 40, rx: 3, class: 'c-meta-soft' }));
    g.appendChild(el('rect', { x: 28, y: py, width: 6, height: 40, class: 'c-meta-f' }));
    g.appendChild(text(46, py + 27, pills[i], 't-meta'));
  }

  return g;
}

/* ============================================================
   RIGHT — three columns
   ============================================================ */
function buildRightZone() {
  const g = el('g');

  const cols = [
    { id: 'A', cx: 720,  label: 'A · NAIVE RAG',      loud: false },
    { id: 'B', cx: 1060, label: 'B · FULL GRAPH RAG', loud: false },
    { id: 'C', cx: 1400, label: 'C · LIGHTRAG',       loud: true  },
  ];

  // Column headers
  const headerY = 130;
  for (const c of cols) {
    const halfw = 160;
    const x = c.cx - halfw;
    g.appendChild(text(x, headerY, c.label, 't-header', { fill: c.loud ? 'var(--c-hier)' : 'var(--fg)' }));
    g.appendChild(el('line', { x1: x, y1: headerY + 14, x2: x + halfw * 2, y2: headerY + 14,
      stroke: c.loud ? 'var(--c-hier)' : 'var(--hairline-strong)', 'stroke-width': c.loud ? 1.8 : 1 }));
  }

  // Column bodies
  buildColA(g, 720);
  buildColB(g, 1060);
  buildColC(g, 1400);

  // Annotations under columns — 2 short lines each
  const annoY = 720;
  const annotations = [
    [['Hierarchy, tables,', 't-anno'], ['citations bleached out.', 't-anno-strong']],
    [['All structure kept.', 't-anno-strong'], ['Rebuild on every paper.', 't-anno']],
    [['Structure kept.', 't-anno-strong'], ['Incremental — no rebuild.', 't-anno']],
  ];
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    const a = annotations[i];
    g.appendChild(el('line', { x1: c.cx - 160, y1: annoY - 28, x2: c.cx + 160, y2: annoY - 28, class: 'hair', 'stroke-width': 1 }));
    let ty = annoY;
    for (const line of a) {
      const t = el('text', { x: c.cx - 160, y: ty, class: line[1] });
      t.appendChild(document.createTextNode(line[0]));
      g.appendChild(t);
      ty += 36;
    }
  }
  return g;
}

/* === A · bleached chunks === */
function buildColA(parent, cx) {
  const x = cx - 130, w = 260;
  const y0 = 180, rows = 6, rh = 64;
  for (let i = 0; i < rows; i++) {
    const cy = y0 + i * rh;
    parent.appendChild(el('rect', { x, y: cy, width: w, height: 52, class: 'bleach', stroke: 'var(--bleached-deep)', 'stroke-width': 1 }));
    for (let j = 0; j < 3; j++) {
      const lw = w - 24 - (j === 2 ? 50 : 0);
      parent.appendChild(el('rect', { x: x + 12, y: cy + 14 + j * 11, width: lw, height: 5, rx: 1, class: 'bleach-mid' }));
    }
  }
}

/* === B · dense graph === */
function buildColB(parent, cx) {
  const bx = cx - 160, by = 180, bw = 320, bh = 480;
  let seed = 1337;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  const nodes = [];
  const colorMix = ['c-hier-f','c-hier-f','c-hier-f','c-tab-f','c-tab-f','c-cite-f','c-cite-f','c-meta-f'];
  const colC = 5, rowC = 7;
  const cellW = bw / (colC + 1), cellH = bh / (rowC + 1);
  for (let r = 0; r < rowC; r++) {
    for (let c = 0; c < colC; c++) {
      const jx = (rnd() - 0.5) * cellW * 0.85;
      const jy = (rnd() - 0.5) * cellH * 0.85;
      nodes.push({
        x: bx + cellW * (c + 1) + jx,
        y: by + cellH * (r + 1) + jy,
        cc: colorMix[Math.floor(rnd() * colorMix.length)],
        rad: 5 + rnd() * 3,
      });
    }
  }

  const edges = [];
  for (let i = 0; i < nodes.length; i++) {
    const dists = nodes.map((n, j) => ({ j, d: (n.x - nodes[i].x) ** 2 + (n.y - nodes[i].y) ** 2 }))
      .filter(o => o.j !== i).sort((a, b) => a.d - b.d);
    const k = 2 + Math.floor(rnd() * 2);
    for (let m = 0; m < k; m++) if (dists[m].j > i) edges.push([i, dists[m].j]);
  }
  for (let k = 0; k < 8; k++) {
    const a = Math.floor(rnd() * nodes.length), b = Math.floor(rnd() * nodes.length);
    if (a !== b) edges.push([a, b]);
  }

  for (const [a, b] of edges) {
    parent.appendChild(el('line', { x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y, class: 'edge-dense' }));
  }
  for (const n of nodes) {
    parent.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.rad, class: `node ${n.cc}`, stroke: 'var(--bg)' }));
  }
}

/* === C · sparse structured graph === */
function buildColC(parent, cx) {
  const bx = cx - 160, by = 180, bw = 320, bh = 480;

  // Cluster regions (no labels — colors carry the message)
  const ring = (x, y, w, h, cls) => {
    parent.appendChild(el('rect', { x: x - w/2, y: y - h/2, width: w, height: h, rx: 14, fill: 'none',
      stroke: cls, 'stroke-width': 0.8, 'stroke-dasharray': '3 4', opacity: 0.55 }));
  };
  ring(cx, by + 100, 290, 150, 'var(--c-hier)');
  ring(cx, by + 250, 280, 70,  'var(--c-tab)');
  ring(cx, by + 340, 240, 60,  'var(--c-cite)');
  ring(cx, by + 420, 240, 50,  'var(--c-meta)');

  const nodes = {
    T:   { x: cx,       y: by + 50,  r: 12, cls: 'c-hier-f' },
    s1:  { x: cx - 80,  y: by + 110, r: 9,  cls: 'c-hier-f' },
    s2:  { x: cx + 80,  y: by + 110, r: 9,  cls: 'c-hier-f' },
    s11: { x: cx - 110, y: by + 160, r: 7,  cls: 'c-hier-f' },
    s12: { x: cx - 50,  y: by + 160, r: 7,  cls: 'c-hier-f' },
    s21: { x: cx + 80,  y: by + 160, r: 7,  cls: 'c-hier-f' },

    t1a: { x: cx - 90,  y: by + 240, r: 7, cls: 'c-tab-f' },
    t1b: { x: cx - 50,  y: by + 264, r: 7, cls: 'c-tab-f' },
    t2a: { x: cx + 60,  y: by + 240, r: 7, cls: 'c-tab-f' },
    t2b: { x: cx + 100, y: by + 264, r: 7, cls: 'c-tab-f' },

    c12: { x: cx - 60,  y: by + 340, r: 9, cls: 'c-cite-f' },
    c27: { x: cx + 60,  y: by + 340, r: 9, cls: 'c-cite-f' },

    m1:  { x: cx - 70,  y: by + 420, r: 9, cls: 'c-meta-f' },
    m2:  { x: cx + 70,  y: by + 420, r: 9, cls: 'c-meta-f' },
  };

  const drawEdges = (pairs, color, opacity = 1) => {
    for (const [a, b] of pairs) {
      const na = nodes[a], nb = nodes[b];
      parent.appendChild(el('line', {
        x1: na.x, y1: na.y, x2: nb.x, y2: nb.y,
        stroke: color, 'stroke-width': 1.8, fill: 'none', opacity,
      }));
    }
  };

  drawEdges([['T','s1'],['T','s2'],['s1','s11'],['s1','s12'],['s2','s21']], 'var(--c-hier)');
  drawEdges([['t1a','t1b'],['t2a','t2b'],['s12','t1a'],['s21','t2a']], 'var(--c-tab)', 0.85);
  drawEdges([['s11','c12'],['s21','c27']], 'var(--c-cite)', 0.75);
  drawEdges([['m1','T'],['m2','T']], 'var(--c-meta)', 0.55);

  for (const id in nodes) {
    const n = nodes[id];
    parent.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.r, class: `node ${n.cls}`, stroke: 'var(--bg)', 'stroke-width': 1.5 }));
  }
}

/* ============================================================
   Defs
   ============================================================ */
function buildDefs() {
  const defs = el('defs');
  const make = (id, cls, size = 7) => {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: size, markerHeight: size, orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M0,1 L10,5 L0,9 Z', class: cls }));
    defs.appendChild(m);
  };
  make('arrow-tab', 'c-tab-f');
  make('arrow-loud', 'c-hier-f');
  make('arrow-quiet', 'ink-faint');
  return defs;
}

/* ============================================================
   Build SVG
   ============================================================ */
function buildSVG() {
  const svg = el('svg', { class: 'fig', viewBox: '0 0 1600 900', xmlns: NS, preserveAspectRatio: 'xMidYMid meet' });
  svg.appendChild(buildDefs());
  svg.appendChild(el('rect', { x: 0, y: 0, width: 1600, height: 900, fill: 'var(--bg)' }));

  // Top title
  svg.appendChild(text(50, 56, 'STRUCTURAL PRESERVATION', 't-title'));
  svg.appendChild(text(1540, 56, '1 PAPER → 3 ARCHITECTURES', 't-cap', { 'text-anchor': 'end' }));
  svg.appendChild(el('line', { x1: 50, y1: 76, x2: 1540, y2: 76, class: 'hair', 'stroke-width': 1 }));

  // Zone divider
  svg.appendChild(el('line', { x1: 510, y1: 90, x2: 510, y2: 830, class: 'col-divider', 'stroke-width': 1 }));

  svg.appendChild(buildPaper());
  svg.appendChild(buildRightZone());

  return svg;
}

document.getElementById('wrap').appendChild(buildSVG());

const host = document.getElementById('figure-host');
const mq = matchMedia('(prefers-color-scheme: dark)');
const setTheme = (t) => { host.dataset.theme = t; };
setTheme(mq.matches ? 'dark' : 'light');
mq.addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'theme' && (d.theme === 'dark' || d.theme === 'light')) setTheme(d.theme);
});
</script>
</body>
