<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Causal inference DAG showing treatment, outcome, and confounder">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bg)"/>

  <!-- Confounder Z at top -->
  <circle cx="240" cy="60" r="32" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="240" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Z</text>
  <text x="240" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Confounder</text>

  <!-- Treatment T bottom-left -->
  <circle cx="110" cy="200" r="32" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="110" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#0f172a">T</text>
  <text x="110" y="252" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Treatment</text>

  <!-- Outcome Y bottom-right -->
  <circle cx="370" cy="200" r="32" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="370" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Y</text>
  <text x="370" y="252" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Outcome</text>

  <!-- Z -> T -->
  <line x1="216" y1="83" x2="132" y2="173" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Z -> Y -->
  <line x1="264" y1="83" x2="348" y2="173" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- T -> Y (causal effect of interest, highlighted) -->
  <line x1="142" y1="200" x2="338" y2="200" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="240" y="190" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#0284c7">τ = ATE</text>
</svg>
