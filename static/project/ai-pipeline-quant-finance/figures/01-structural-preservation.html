<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fig 01 — Structural preservation under ingestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.003 80);
    --bg-sub: oklch(0.965 0.004 80);
    --paper: #ffffff;
    --paper-edge: oklch(0.88 0.005 80);
    --fg: oklch(0.18 0.01 270);
    --fg-muted: oklch(0.46 0.006 270);
    --fg-faint: oklch(0.62 0.005 270);
    --hairline: oklch(0.86 0.005 80);
    --hairline-strong: oklch(0.74 0.006 80);
    --bleached: oklch(0.86 0.004 80);
    --bleached-mid: oklch(0.74 0.004 80);
    --bleached-deep: oklch(0.58 0.005 80);

    /* Element-coded palette — same chroma, varied hue */
    --c-hier:  oklch(0.58 0.16 28);    /* §-sections   — accent red */
    --c-tab:   oklch(0.58 0.11 200);   /* tables       — teal */
    --c-cite:  oklch(0.55 0.14 268);   /* citations    — indigo */
    --c-meta:  oklch(0.62 0.10 132);   /* metadata     — olive */

    --c-hier-soft: oklch(0.58 0.16 28 / 0.14);
    --c-tab-soft:  oklch(0.58 0.11 200 / 0.14);
    --c-cite-soft: oklch(0.55 0.14 268 / 0.16);
    --c-meta-soft: oklch(0.62 0.10 132 / 0.16);

    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: oklch(0.16 0.008 270);
    --bg-sub: oklch(0.20 0.008 270);
    --paper: oklch(0.215 0.008 270);
    --paper-edge: oklch(0.32 0.008 270);
    --fg: oklch(0.96 0.003 80);
    --fg-muted: oklch(0.70 0.005 80);
    --fg-faint: oklch(0.48 0.005 80);
    --hairline: oklch(0.28 0.008 270);
    --hairline-strong: oklch(0.42 0.008 270);
    --bleached: oklch(0.34 0.005 270);
    --bleached-mid: oklch(0.44 0.005 270);
    --bleached-deep: oklch(0.58 0.005 270);

    --c-hier:  oklch(0.70 0.17 28);
    --c-tab:   oklch(0.72 0.11 200);
    --c-cite:  oklch(0.70 0.14 268);
    --c-meta:  oklch(0.76 0.10 132);

    --c-hier-soft: oklch(0.70 0.17 28 / 0.20);
    --c-tab-soft:  oklch(0.72 0.11 200 / 0.18);
    --c-cite-soft: oklch(0.70 0.14 268 / 0.22);
    --c-meta-soft: oklch(0.76 0.10 132 / 0.20);
  }

  html, body { margin: 0; background: var(--bg-sub); color: var(--fg); font-family: var(--sans); }

  .review {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .variant {
    padding: 28px clamp(20px, 4vw, 64px) 48px;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline);
  }
  .variant-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .variant-head .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c-hier);
    display: inline-block;
  }
  .variant-head .meta { color: var(--fg-faint); margin-left: auto; }

  .figure-wrap {
    border: 1px solid var(--hairline);
    background: var(--bg);
    max-width: 1600px;
  }
  svg.fig { width: 100%; height: auto; display: block; }

  /* SVG element styles via CSS so theme cascades */
  .fig .paper-bg     { fill: var(--paper); stroke: var(--paper-edge); }
  .fig .paper-shadow { fill: color-mix(in srgb, var(--fg) 8%, transparent); }
  .fig .hair         { stroke: var(--hairline); }
  .fig .hair-s       { stroke: var(--hairline-strong); }
  .fig .ink          { fill: var(--fg); }
  .fig .ink-muted    { fill: var(--fg-muted); }
  .fig .ink-faint    { fill: var(--fg-faint); }
  .fig .ink-stroke   { stroke: var(--fg); }

  .fig .c-hier-f { fill: var(--c-hier); }
  .fig .c-hier-s { stroke: var(--c-hier); }
  .fig .c-hier-soft { fill: var(--c-hier-soft); }
  .fig .c-tab-f  { fill: var(--c-tab); }
  .fig .c-tab-s  { stroke: var(--c-tab); }
  .fig .c-tab-soft { fill: var(--c-tab-soft); }
  .fig .c-cite-f { fill: var(--c-cite); }
  .fig .c-cite-s { stroke: var(--c-cite); }
  .fig .c-cite-soft { fill: var(--c-cite-soft); }
  .fig .c-meta-f { fill: var(--c-meta); }
  .fig .c-meta-s { stroke: var(--c-meta); }
  .fig .c-meta-soft { fill: var(--c-meta-soft); }

  .fig .bleach     { fill: var(--bleached); }
  .fig .bleach-mid { fill: var(--bleached-mid); }
  .fig .bleach-deep{ fill: var(--bleached-deep); }

  .fig text { font-family: var(--mono); fill: var(--fg); }
  .fig .t-mono       { font-family: var(--mono); }
  .fig .t-sans       { font-family: var(--sans); }
  .fig .t-header     { font-family: var(--mono); font-size: 13px; letter-spacing: 0.10em; fill: var(--fg); }
  .fig .t-sub        { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.10em; fill: var(--fg-muted); text-transform: uppercase; }
  .fig .t-label      { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; fill: var(--fg-faint); text-transform: uppercase; }
  .fig .t-axis       { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; fill: var(--fg-muted); text-transform: uppercase; }
  .fig .t-anno       { font-family: var(--mono); font-size: 11px; fill: var(--fg-muted); }
  .fig .t-anno-strong{ font-family: var(--mono); font-size: 11px; fill: var(--fg); }
  .fig .t-section    { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; fill: var(--fg); }
  .fig .t-body-bar   { fill: color-mix(in srgb, var(--fg) 22%, transparent); }
  .fig .t-cap        { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.12em; fill: var(--fg-faint); text-transform: uppercase; }
  .fig .t-cite-num   { font-family: var(--mono); font-size: 8px; fill: var(--c-cite); font-weight: 500; }

  .fig .col-divider { stroke: var(--hairline); stroke-dasharray: 2 4; }
  .fig .arrow-quiet { stroke: var(--hairline-strong); fill: none; }
  .fig .arrow-loud  { stroke: var(--c-hier); fill: none; }

  /* Graph */
  .fig .edge-dense   { stroke: color-mix(in srgb, var(--fg) 30%, transparent); stroke-width: 1; fill: none; }
  .fig .edge-clean   { stroke-width: 1.4; fill: none; }
  .fig .node         { stroke-width: 1.2; }
  .fig .node-bleach  { fill: var(--bleached); stroke: var(--bleached-deep); }

  /* In-article iframe overrides */
  html, body { background: var(--bg); }
  body.variant { padding: 0; border-bottom: 0; }
  .figure-wrap { border: 0; max-width: none; }
  svg.fig { width: 100%; height: auto; display: block; }
</style>
</head>
<body id="figure-host" class="variant">
  <div class="figure-wrap" id="wrap"></div>

<script>
/* ============================================================
   Build the SVG once and inject into both light + dark wrappers.
   ============================================================ */

const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs = {}, children = []) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  }
  return n;
}
function text(x, y, str, cls, extra = {}) {
  return el('text', { x, y, class: cls, ...extra }, str);
}

/* ---------- LEFT ZONE — the paper ---------- */
function buildPaper() {
  const g = el('g', { class: 'paper', transform: 'translate(60, 70)' });
  const W = 400, H = 760;

  // shadow + paper
  g.appendChild(el('rect', { x: 6, y: 8, width: W, height: H, rx: 2, class: 'paper-shadow' }));
  g.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, rx: 2, class: 'paper-bg', 'stroke-width': 1 }));

  // doc header strip
  g.appendChild(text(20, 32, 'STRUCTURED DOCUMENT', 't-sub'));
  g.appendChild(text(W - 20, 32, 'DOC #4001', 't-cap', { 'text-anchor': 'end' }));
  g.appendChild(el('line', { x1: 20, y1: 44, x2: W - 20, y2: 44, class: 'hair', 'stroke-width': 1 }));

  // Title block (heavier ink, no §)
  g.appendChild(el('rect', { x: 20, y: 60, width: 240, height: 12, fill: 'currentColor', class: 'ink', opacity: 0.85 }));
  g.appendChild(el('rect', { x: 20, y: 78, width: 160, height: 8,  fill: 'currentColor', class: 'ink', opacity: 0.5 }));

  // Mini-tag glossary (legend, top right)
  const lg = el('g', { transform: 'translate(280, 60)' });
  const legendItems = [
    { c: 'c-hier-f',  label: 'HIER',  y: 0 },
    { c: 'c-tab-f',   label: 'TABLE', y: 14 },
    { c: 'c-cite-f',  label: 'CITE',  y: 28 },
    { c: 'c-meta-f',  label: 'META',  y: 42 },
  ];
  for (const li of legendItems) {
    lg.appendChild(el('rect', { x: 0, y: li.y - 6, width: 8, height: 8, class: li.c }));
    lg.appendChild(text(14, li.y, li.label, 't-cap'));
  }
  g.appendChild(lg);

  // -- § 1 INTRODUCTION
  let y = 116;
  const drawSection = (indent, code, title, lineWidths, citeAfter = null) => {
    const x = 20 + indent;
    // colored tag bar
    g.appendChild(el('rect', { x, y: y - 9, width: 4, height: 12, class: 'c-hier-f' }));
    g.appendChild(text(x + 10, y, `§ ${code}  ${title}`, 't-section'));
    let ly = y + 12;
    for (const w of lineWidths) {
      g.appendChild(el('rect', { x: x + 10, y: ly, width: w, height: 4, rx: 1, class: 't-body-bar' }));
      ly += 9;
    }
    if (citeAfter) {
      // little superscript pill
      g.appendChild(el('rect', { x: x + 10 + citeAfter.afterW + 4, y: ly - 10, width: 14, height: 8, rx: 4, class: 'c-cite-soft' }));
      g.appendChild(text(x + 10 + citeAfter.afterW + 4 + 7, ly - 4, citeAfter.n, 't-cite-num', { 'text-anchor': 'middle' }));
    }
    return ly + 8;
  };

  y = drawSection(0,  '1',   'INTRODUCTION', [220, 200, 170]);
  y = drawSection(14, '1.1', 'Hypothesis',   [180, 150], { afterW: 150, n: '[12]' });
  y = drawSection(14, '1.2', 'Data sources', [200]);

  // --- TABLE 1 (teal) ---
  const t1y = y + 4;
  drawTable(g, 24, t1y, 280, 64, {
    cols: 4, rows: 3,
    title: 'TABLE 1 · STRATEGY × HORIZON',
    highlights: [[1, 1], [1, 2], [2, 1]],
    arrow: { from: [1, 1], to: [2, 1] },
  });
  y = t1y + 64 + 14;

  // --- § 2 RESULTS
  y = drawSection(0, '2', 'RESULTS', [220, 180], { afterW: 180, n: '[27]' });

  // --- TABLE 2 (teal) ---
  const t2y = y + 4;
  drawTable(g, 24, t2y, 280, 56, {
    cols: 5, rows: 2,
    title: 'TABLE 2 · FACTOR LOADINGS',
    highlights: [[1, 2], [1, 3], [1, 4]],
    arrow: { from: [1, 2], to: [1, 4], curved: true },
  });
  y = t2y + 56 + 18;

  // --- METADATA pills (olive) ---
  g.appendChild(text(20, y, 'ENRICHED METADATA', 't-sub', { class: 't-sub' }));
  y += 8;
  const metaPills = [
    'AUTHOR · LIN ET AL.   ·   MIT SLOAN',
    'CITED 412×   ·   h-INDEX 31',
    'PUBLISHED 2023   ·   PEER-REVIEWED',
  ];
  for (const m of metaPills) {
    y += 14;
    g.appendChild(el('rect', { x: 20, y: y - 11, width: 360, height: 16, rx: 8, class: 'c-meta-soft' }));
    g.appendChild(el('rect', { x: 20, y: y - 11, width: 3,   height: 16, class: 'c-meta-f' }));
    g.appendChild(text(30, y + 0.5, m, 't-cap', { class: 't-cap', fill: 'var(--fg)' }));
  }

  // --- Bibliography footer
  y += 22;
  g.appendChild(el('line', { x1: 20, y1: y, x2: W - 20, y2: y, class: 'hair', 'stroke-width': 1 }));
  y += 14;
  g.appendChild(text(20, y, 'BIBLIOGRAPHY', 't-sub'));
  y += 14;
  const refs = [
    { n: '12', t: 'Carhart, M.M.  Mutual fund performance' },
    { n: '27', t: 'Fama & French.  Five-factor asset pricing' },
    { n: '41', t: 'Asness et al.  Quality minus junk' },
  ];
  for (const r of refs) {
    g.appendChild(el('circle', { cx: 26, cy: y - 3, r: 6, class: 'c-cite-soft' }));
    g.appendChild(text(26, y, r.n, 't-cite-num', { 'text-anchor': 'middle' }));
    g.appendChild(text(40, y, r.t, 't-cap'));
    y += 14;
  }

  return g;
}

function drawTable(parent, x, y, w, h, opts) {
  const { cols, rows, title, highlights = [], arrow } = opts;
  const cw = w / cols;
  const rh = (h - 12) / rows;

  // caption
  parent.appendChild(text(x, y - 4, title, 't-cap'));

  const tg = el('g');
  // outer frame
  tg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'none', class: 'c-tab-s', 'stroke-width': 1 }));
  // header row tint
  tg.appendChild(el('rect', { x, y, width: w, height: 12, class: 'c-tab-soft' }));

  // highlights (under grid)
  for (const [r, c] of highlights) {
    tg.appendChild(el('rect', {
      x: x + c * cw, y: y + 12 + (r - 1) * rh,
      width: cw, height: rh, class: 'c-tab-soft',
    }));
  }

  // grid lines
  for (let i = 1; i < cols; i++) {
    tg.appendChild(el('line', { x1: x + i * cw, y1: y, x2: x + i * cw, y2: y + h, class: 'c-tab-s', 'stroke-width': 0.8, opacity: 0.55 }));
  }
  tg.appendChild(el('line', { x1: x, y1: y + 12, x2: x + w, y2: y + 12, class: 'c-tab-s', 'stroke-width': 1 }));
  for (let i = 1; i < rows; i++) {
    tg.appendChild(el('line', { x1: x, y1: y + 12 + i * rh, x2: x + w, y2: y + 12 + i * rh, class: 'c-tab-s', 'stroke-width': 0.8, opacity: 0.45 }));
  }

  // header glyphs (tiny rectangles inside header cells)
  for (let c = 0; c < cols; c++) {
    tg.appendChild(el('rect', { x: x + c * cw + 4, y: y + 4, width: cw - 8, height: 4, rx: 1, class: 'c-tab-f', opacity: 0.7 }));
  }
  // body glyphs
  for (let r = 1; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      tg.appendChild(el('rect', { x: x + c * cw + 5, y: y + 12 + (r - 1) * rh + (rh - 4) / 2, width: cw - 10, height: 3, rx: 1, fill: 'currentColor', class: 'ink', opacity: 0.25 }));
    }
  }

  // arrow showing row/column relationship
  if (arrow) {
    const [fr, fc] = arrow.from;
    const [tr, tc] = arrow.to;
    const x1 = x + fc * cw + cw / 2;
    const y1 = y + 12 + (fr - 1) * rh + rh / 2;
    const x2 = x + tc * cw + cw / 2;
    const y2 = y + 12 + (tr - 1) * rh + rh / 2;
    if (arrow.curved) {
      const cx = (x1 + x2) / 2;
      const cy = y - 10;
      tg.appendChild(el('path', {
        d: `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`,
        class: 'c-tab-s', 'stroke-width': 1.2, fill: 'none',
        'marker-end': 'url(#arrow-tab)',
      }));
    } else {
      tg.appendChild(el('path', {
        d: `M ${x1} ${y1} L ${x2} ${y2}`,
        class: 'c-tab-s', 'stroke-width': 1.2, fill: 'none',
        'marker-end': 'url(#arrow-tab)',
      }));
    }
  }
  parent.appendChild(tg);
}

/* ---------- RIGHT ZONE — three columns ---------- */
function buildRightZone() {
  const g = el('g', { class: 'right' });

  // Axis at top
  const axisY = 122;
  const axisX1 = 540, axisX2 = 1540;
  g.appendChild(text((axisX1 + axisX2) / 2, axisY - 18, 'WHAT DOWNSTREAM QUERIES CAN ASK', 't-axis', { 'text-anchor': 'middle' }));
  g.appendChild(el('line', { x1: axisX1, y1: axisY, x2: axisX2, y2: axisY, class: 'hair-s', 'stroke-width': 1 }));
  // ticks
  for (let x = axisX1; x <= axisX2; x += 50) {
    g.appendChild(el('line', { x1: x, y1: axisY, x2: x, y2: axisY + 4, class: 'hair', 'stroke-width': 1 }));
  }

  // Column centers
  const cols = [
    { id: 'A', cx: 700,  label: 'A · NAIVE RAG',           loud: false },
    { id: 'B', cx: 1040, label: 'B · FULL GRAPH RAG',      loud: false },
    { id: 'C', cx: 1380, label: 'C · LIGHTRAG (SELECTED)', loud: true  },
  ];

  // Drop arrows from axis into columns
  for (const c of cols) {
    const cls = c.loud ? 'arrow-loud' : 'arrow-quiet';
    g.appendChild(el('path', {
      d: `M ${c.cx} ${axisY} L ${c.cx} ${axisY + 56}`,
      class: cls, 'stroke-width': c.loud ? 1.6 : 1,
      'marker-end': c.loud ? 'url(#arrow-loud)' : 'url(#arrow-quiet)',
    }));
  }

  // Column headers
  const headerY = 210;
  for (const c of cols) {
    const halfw = 158;
    const x = c.cx - halfw;
    g.appendChild(el('line', { x1: x, y1: headerY + 10, x2: x + halfw * 2, y2: headerY + 10, class: 'hair-s', 'stroke-width': 1 }));
    g.appendChild(text(x, headerY, c.label, 't-header'));
    if (c.loud) {
      g.appendChild(el('circle', { cx: x + 160, cy: headerY - 4, r: 4, class: 'c-hier-f' }));
    }
  }

  // === Column A — bleached chunks ===
  buildColA(g, 700);

  // === Column B — dense graph ===
  buildColB(g, 1040);

  // === Column C — sparse, structured graph ===
  buildColC(g, 1380);

  // === Annotations ===
  const annoY = 760;
  const annotations = [
    { cx: 700,  lines: [
        ['Hierarchy, tables, and citation graph', 't-anno'],
        ['lost. Embeddings index ', 't-anno', 'flat text.', 't-anno-strong'],
    ]},
    { cx: 1040, lines: [
        ['All structure preserved. ', 't-anno-strong', 'Rebuild', 't-anno-strong'],
        ['required to ingest each new paper.', 't-anno'],
        ['2–3× slower throughput.', 't-anno'],
    ]},
    { cx: 1380, lines: [
        ['Hierarchy + entity relationships', 't-anno-strong'],
        ['preserved. ', 't-anno', 'Incremental ingestion', 't-anno-strong'],
        ['— no rebuild on each new paper.', 't-anno'],
    ]},
  ];

  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    const a = annotations[i];
    // hairline above annotation block
    g.appendChild(el('line', { x1: c.cx - 158, y1: annoY - 22, x2: c.cx + 158, y2: annoY - 22, class: 'hair', 'stroke-width': 1 }));
    // small index pill
    g.appendChild(text(c.cx - 158, annoY - 6, '↳ ' + c.id, 't-cap'));
    // lines
    let ty = annoY + 14;
    for (const line of a.lines) {
      // assemble tspans
      const txt = el('text', { x: c.cx - 158, y: ty, class: 't-anno' });
      for (let k = 0; k < line.length; k += 2) {
        const t = el('tspan', { class: line[k + 1] }, line[k]);
        txt.appendChild(t);
      }
      g.appendChild(txt);
      ty += 16;
    }
  }

  return g;
}

/* === Column A : bleached chunks (Naive RAG) === */
function buildColA(parent, cx) {
  const x = cx - 110, w = 220;
  let y = 250;
  const rows = 9;
  for (let i = 0; i < rows; i++) {
    const chunkY = y + i * 50;
    parent.appendChild(el('rect', { x, y: chunkY, width: w, height: 42, class: 'bleach', stroke: 'var(--bleached-deep)', 'stroke-width': 0.8 }));
    // chunk index
    parent.appendChild(text(x + 6, chunkY + 12, `CHUNK·${String(i + 1).padStart(3, '0')}`, 't-cap', { fill: 'var(--bleached-deep)' }));
    // text lines (uniform bleached)
    for (let j = 0; j < 3; j++) {
      const lw = w - 16 - (j === 2 ? 36 : 0) - (j === 1 ? 12 : 0);
      parent.appendChild(el('rect', { x: x + 8, y: chunkY + 18 + j * 7, width: lw, height: 3, rx: 1, class: 'bleach-mid' }));
    }
  }
  // bleach fade at bottom
  const fadeY = y + rows * 50;
  parent.appendChild(el('rect', { x, y: fadeY, width: w, height: 12, fill: 'var(--bleached)', opacity: 0.4 }));
  // index label
  parent.appendChild(text(cx, fadeY + 28, '→ FLAT VECTOR INDEX', 't-cap', { 'text-anchor': 'middle' }));
}

/* === Column B : dense graph (Full Graph RAG) === */
function buildColB(parent, cx) {
  // Bounded box
  const bx = cx - 158, by = 250, bw = 316, bh = 460;

  // Seeded RNG so positions are stable
  let seed = 1337;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  // Generate ~38 nodes in a jittered grid
  const nodes = [];
  const colorClasses = ['c-hier-f', 'c-tab-f', 'c-cite-f', 'c-meta-f'];
  // bias colors to roughly match paper composition
  const colorMix = ['c-hier-f','c-hier-f','c-hier-f','c-hier-f','c-tab-f','c-tab-f','c-tab-f','c-cite-f','c-cite-f','c-meta-f'];

  const cols = 5, rows = 8;
  const cellW = bw / (cols + 1);
  const cellH = bh / (rows + 1);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const jitterX = (rnd() - 0.5) * cellW * 0.8;
      const jitterY = (rnd() - 0.5) * cellH * 0.8;
      const x = bx + cellW * (c + 1) + jitterX;
      const y = by + cellH * (r + 1) + jitterY;
      const cc = colorMix[Math.floor(rnd() * colorMix.length)];
      const rad = 3 + rnd() * 2;
      nodes.push({ x, y, cc, rad });
    }
  }

  // Edges: each node connects to ~2-3 nearest neighbors (chaotic mess)
  const edges = [];
  for (let i = 0; i < nodes.length; i++) {
    const dists = nodes.map((n, j) => ({ j, d: (n.x - nodes[i].x) ** 2 + (n.y - nodes[i].y) ** 2 }))
      .filter(o => o.j !== i)
      .sort((a, b) => a.d - b.d);
    const k = 2 + Math.floor(rnd() * 2);
    for (let m = 0; m < k; m++) {
      const j = dists[m].j;
      if (j > i) edges.push([i, j]);
    }
  }
  // Add a few long-range edges
  for (let k = 0; k < 10; k++) {
    const a = Math.floor(rnd() * nodes.length);
    const b = Math.floor(rnd() * nodes.length);
    if (a !== b) edges.push([a, b]);
  }

  // Draw edges first
  for (const [a, b] of edges) {
    parent.appendChild(el('line', {
      x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y,
      class: 'edge-dense',
    }));
  }
  // Draw nodes
  for (const n of nodes) {
    parent.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.rad, class: `node ${n.cc}` , stroke: 'var(--bg)' }));
  }

  // Footer label
  parent.appendChild(text(cx, by + bh + 28, '→ FULL KNOWLEDGE GRAPH (REBUILD)', 't-cap', { 'text-anchor': 'middle' }));

  // Size badge top-right of column
  parent.appendChild(el('rect', { x: bx + bw - 70, y: by - 16, width: 70, height: 14, rx: 7, class: 'hair', fill: 'none', stroke: 'var(--hairline-strong)' }));
  parent.appendChild(text(bx + bw - 35, by - 6, `${nodes.length} NODES`, 't-cap', { 'text-anchor': 'middle' }));
}

/* === Column C : sparse, structured graph (LightRAG) === */
function buildColC(parent, cx) {
  const bx = cx - 158, by = 250, bw = 316, bh = 460;

  // ---- Clusters ----
  // Hierarchy tree (top): Title → §1, §2 → §1.1, §1.2 / §2.1
  const hier = [
    { id: 'T',   x: cx,        y: by + 26, r: 8, cls: 'c-hier-f' },
    { id: '1',   x: cx - 56,   y: by + 70, r: 6, cls: 'c-hier-f' },
    { id: '2',   x: cx + 56,   y: by + 70, r: 6, cls: 'c-hier-f' },
    { id: '1.1', x: cx - 90,   y: by + 112, r: 4, cls: 'c-hier-f' },
    { id: '1.2', x: cx - 28,   y: by + 112, r: 4, cls: 'c-hier-f' },
    { id: '2.1', x: cx + 56,   y: by + 112, r: 4, cls: 'c-hier-f' },
  ];
  const hierEdges = [
    ['T','1'], ['T','2'],
    ['1','1.1'], ['1','1.2'],
    ['2','2.1'],
  ];

  // Table cluster (middle-left)
  const tables = [
    // table 1
    { id: 't1a', x: cx - 90,  y: by + 180, r: 4, cls: 'c-tab-f' },
    { id: 't1b', x: cx - 60,  y: by + 196, r: 4, cls: 'c-tab-f' },
    { id: 't1c', x: cx - 75,  y: by + 220, r: 4, cls: 'c-tab-f' },
    // table 2
    { id: 't2a', x: cx + 50,  y: by + 188, r: 4, cls: 'c-tab-f' },
    { id: 't2b', x: cx + 86,  y: by + 200, r: 4, cls: 'c-tab-f' },
    { id: 't2c', x: cx + 70,  y: by + 222, r: 4, cls: 'c-tab-f' },
  ];
  const tableEdges = [
    ['t1a','t1b'], ['t1b','t1c'], ['t1a','t1c'],
    ['t2a','t2b'], ['t2b','t2c'], ['t2a','t2c'],
  ];

  // Section → Table relations
  const sectToTable = [
    ['1.2','t1a'],
    ['2.1','t2a'],
  ];

  // Citations (lower)
  const cites = [
    { id: 'c12', x: cx - 60,  y: by + 280, r: 5, cls: 'c-cite-f' },
    { id: 'c27', x: cx + 0,   y: by + 296, r: 5, cls: 'c-cite-f' },
    { id: 'c41', x: cx + 70,  y: by + 280, r: 5, cls: 'c-cite-f' },
  ];
  const sectToCite = [
    ['1.1','c12'],
    ['2.1','c27'],
    ['c12','t2a'],
    ['c41','c27'],
  ];

  // Metadata (bottom)
  const metas = [
    { id: 'mA', x: cx - 70, y: by + 360, r: 5, cls: 'c-meta-f' },
    { id: 'mB', x: cx,      y: by + 372, r: 5, cls: 'c-meta-f' },
    { id: 'mC', x: cx + 70, y: by + 360, r: 5, cls: 'c-meta-f' },
  ];
  const metaToDoc = [
    ['mA','T'], ['mB','T'], ['mC','T'],
  ];

  const allNodes = [...hier, ...tables, ...cites, ...metas];
  const idx = id => allNodes.find(n => n.id === id);

  // Cluster ring shadows
  const ring = (x, y, w, h, cls) => {
    parent.appendChild(el('rect', { x: x - w/2, y: y - h/2, width: w, height: h, rx: 10, fill: 'none', class: cls, 'stroke-width': 0.6, 'stroke-dasharray': '2 3', opacity: 0.55 }));
  };
  ring(cx,        by + 70,  240, 110, 'c-hier-s');
  ring(cx,        by + 200, 260, 70,  'c-tab-s');
  ring(cx,        by + 288, 220, 40,  'c-cite-s');
  ring(cx,        by + 368, 220, 36,  'c-meta-s');

  // cluster labels (left side)
  const labelCol = bx + 6;
  parent.appendChild(text(labelCol, by + 18, 'HIERARCHY', 't-cap'));
  parent.appendChild(text(labelCol, by + 165, 'TABLES', 't-cap'));
  parent.appendChild(text(labelCol, by + 268, 'CITATIONS', 't-cap'));
  parent.appendChild(text(labelCol, by + 352, 'METADATA', 't-cap'));

  // Draw edges
  const drawEdges = (pairs, cls, opacity = 1) => {
    for (const [a, b] of pairs) {
      const na = idx(a), nb = idx(b);
      if (!na || !nb) continue;
      parent.appendChild(el('line', {
        x1: na.x, y1: na.y, x2: nb.x, y2: nb.y,
        class: `edge-clean ${cls}`, opacity,
      }));
    }
  };

  drawEdges(hierEdges, 'c-hier-s');
  drawEdges(tableEdges, 'c-tab-s', 0.8);
  drawEdges(sectToTable, 'hair-s', 0.65);
  drawEdges(sectToCite, 'c-cite-s', 0.7);
  drawEdges(metaToDoc, 'c-meta-s', 0.5);

  // Draw nodes (with bg-colored stroke ring for clarity)
  for (const n of allNodes) {
    parent.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.r, class: `node ${n.cls}`, stroke: 'var(--bg)', 'stroke-width': 1.4 }));
  }

  // Node labels for hierarchy
  for (const n of hier) {
    parent.appendChild(text(n.x, n.y - n.r - 4, `§${n.id === 'T' ? 'T' : n.id}`, 't-cap', { 'text-anchor': 'middle', fill: 'var(--c-hier)' }));
  }
  // Citation labels
  for (const c of cites) {
    parent.appendChild(text(c.x, c.y + 3, c.id.slice(1), 't-cite-num', { 'text-anchor': 'middle', fill: 'var(--bg)' }));
  }

  // Right-aligned size badge
  parent.appendChild(el('rect', { x: bx + bw - 130, y: by - 16, width: 130, height: 14, rx: 7, class: 'c-hier-s', fill: 'var(--c-hier-soft)' }));
  parent.appendChild(text(bx + bw - 65, by - 6, `+1 PAPER · NO REBUILD`, 't-cap', { 'text-anchor': 'middle', fill: 'var(--c-hier)' }));

  // Footer
  parent.appendChild(text(cx, by + 440, '→ INCREMENTAL · STRUCTURE-AWARE', 't-cap', { 'text-anchor': 'middle' }));
}

/* ---------- Defs (arrow markers) ---------- */
function buildDefs() {
  const defs = el('defs');
  const markers = [
    { id: 'arrow-tab',   cls: 'c-tab-f',  size: 6 },
    { id: 'arrow-loud',  cls: 'c-hier-f', size: 7 },
    { id: 'arrow-quiet', cls: 'ink-faint', size: 6 },
  ];
  for (const m of markers) {
    const mk = el('marker', {
      id: m.id, viewBox: '0 0 10 10', refX: 7, refY: 5,
      markerWidth: m.size, markerHeight: m.size,
      orient: 'auto-start-reverse',
    });
    mk.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 Z', class: m.cls }));
    defs.appendChild(mk);
  }
  return defs;
}

/* ---------- Build the whole SVG ---------- */
function buildSVG() {
  const svg = el('svg', {
    class: 'fig',
    viewBox: '0 0 1600 900',
    xmlns: NS,
    preserveAspectRatio: 'xMidYMid meet',
  });
  svg.appendChild(buildDefs());

  // Background fill (so PNG export reads it)
  svg.appendChild(el('rect', { x: 0, y: 0, width: 1600, height: 900, fill: 'var(--bg)' }));

  // Caption strip top
  svg.appendChild(text(60, 40, 'STRUCTURAL PRESERVATION MATRIX', 't-header', { fill: 'var(--fg)' }));
  svg.appendChild(text(1540, 40, 'INGESTION · 1 PAPER → 3 ARCHITECTURES', 't-cap', { 'text-anchor': 'end' }));
  svg.appendChild(el('line', { x1: 60, y1: 56, x2: 1540, y2: 56, class: 'hair', 'stroke-width': 1 }));

  // Vertical zone divider
  svg.appendChild(el('line', { x1: 500, y1: 70, x2: 500, y2: 830, class: 'col-divider', 'stroke-width': 1 }));

  svg.appendChild(buildPaper());
  svg.appendChild(buildRightZone());

  // Bottom hairline + footnote
  svg.appendChild(el('line', { x1: 60, y1: 854, x2: 1540, y2: 854, class: 'hair', 'stroke-width': 1 }));
  svg.appendChild(text(60, 876, 'COLOR-CODED: §-HIERARCHY · TABLES · CITATIONS · ENRICHED METADATA', 't-cap'));
  svg.appendChild(text(1540, 876, 'BLEACHED = STRUCTURE LOST · SOLID = STRUCTURE PRESERVED', 't-cap', { 'text-anchor': 'end' }));

  return svg;
}

document.getElementById('wrap').appendChild(buildSVG());

const host = document.getElementById('figure-host');
const mq = matchMedia('(prefers-color-scheme: dark)');
const setTheme = (t) => { host.dataset.theme = t; };
setTheme(mq.matches ? 'dark' : 'light');
mq.addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'theme' && (d.theme === 'dark' || d.theme === 'light')) setTheme(d.theme);
});
</script>
