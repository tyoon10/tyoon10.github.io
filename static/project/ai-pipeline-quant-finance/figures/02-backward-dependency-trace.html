<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fig 02 — Backward dependency trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.003 80);
    --bg-sub: oklch(0.965 0.004 80);
    --fg: oklch(0.18 0.01 270);
    --fg-muted: oklch(0.46 0.006 270);
    --fg-faint: oklch(0.62 0.005 270);
    --hairline: oklch(0.86 0.005 80);
    --hairline-strong: oklch(0.72 0.006 80);
    --neutral-fill: oklch(0.95 0.004 80);
    --neutral-fill-2: oklch(0.92 0.004 80);

    --accent:        oklch(0.58 0.16 28);
    --accent-soft:   oklch(0.58 0.16 28 / 0.10);
    --accent-medium: oklch(0.58 0.16 28 / 0.24);
    --accent-ink:    oklch(0.46 0.18 28);

    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: oklch(0.16 0.008 270);
    --bg-sub: oklch(0.20 0.008 270);
    --fg: oklch(0.96 0.003 80);
    --fg-muted: oklch(0.70 0.005 80);
    --fg-faint: oklch(0.48 0.005 80);
    --hairline: oklch(0.28 0.008 270);
    --hairline-strong: oklch(0.44 0.008 270);
    --neutral-fill: oklch(0.22 0.008 270);
    --neutral-fill-2: oklch(0.26 0.008 270);

    --accent:        oklch(0.72 0.17 28);
    --accent-soft:   oklch(0.72 0.17 28 / 0.16);
    --accent-medium: oklch(0.72 0.17 28 / 0.32);
    --accent-ink:    oklch(0.82 0.16 28);
  }

  html, body { margin: 0; background: var(--bg-sub); color: var(--fg); font-family: var(--sans); }
  .variant { padding: 28px clamp(20px, 4vw, 64px) 48px; background: var(--bg); border-bottom: 1px solid var(--hairline); }
  .variant-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
  .variant-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .variant-head .meta { color: var(--fg-faint); margin-left: auto; }
  .figure-wrap { border: 1px solid var(--hairline); background: var(--bg); max-width: 1600px; }
  svg.fig { width: 100%; height: auto; display: block; }

  .fig .hair    { stroke: var(--hairline); fill: none; }
  .fig .hair-s  { stroke: var(--hairline-strong); fill: none; }
  .fig .ink     { fill: var(--fg); }
  .fig .ink-muted { fill: var(--fg-muted); }
  .fig .ink-faint { fill: var(--fg-faint); }

  .fig .acc-f      { fill: var(--accent); }
  .fig .acc-s      { stroke: var(--accent); fill: none; }
  .fig .acc-ink    { fill: var(--accent-ink); }
  .fig .acc-soft   { fill: var(--accent-soft); }
  .fig .acc-medium { fill: var(--accent-medium); }

  .fig .neutral-fill   { fill: var(--neutral-fill); }
  .fig .neutral-fill-2 { fill: var(--neutral-fill-2); }

  /* Type — mobile-readable floor 22px native */
  .fig text { font-family: var(--mono); fill: var(--fg); }
  .fig .t-cap    { font-family: var(--mono); font-size: 22px; letter-spacing: 0.08em; fill: var(--fg-muted); text-transform: uppercase; }
  .fig .t-num    { font-family: var(--mono); font-size: 22px; letter-spacing: 0.04em; fill: var(--fg-faint); }
  .fig .t-pill   { font-family: var(--mono); font-size: 26px; letter-spacing: 0.02em; fill: var(--fg); font-weight: 500; }
  .fig .t-stage  { font-family: var(--mono); font-size: 24px; letter-spacing: 0.04em; fill: var(--fg); font-weight: 500; }
  .fig .t-stage-body { font-family: var(--mono); font-size: 22px; fill: var(--fg-muted); letter-spacing: 0.02em; }
  .fig .t-rail-n { font-family: var(--mono); font-size: 26px; letter-spacing: 0.02em; fill: var(--fg-faint); font-weight: 500; }
  .fig .t-rail-t { font-family: var(--mono); font-size: 22px; letter-spacing: 0.08em; fill: var(--fg); text-transform: uppercase; }
  .fig .t-title  { font-family: var(--mono); font-size: 30px; letter-spacing: 0.04em; fill: var(--fg); font-weight: 500; }
  .fig .t-quote  { font-family: var(--sans); font-size: 38px; letter-spacing: -0.01em; fill: var(--fg); font-weight: 400; }
  .fig .t-quote-em { font-family: var(--sans); font-size: 38px; letter-spacing: -0.01em; fill: var(--accent-ink); font-weight: 600; }
  .fig .t-callout-h { font-family: var(--mono); font-size: 22px; letter-spacing: 0.10em; fill: var(--accent-ink); text-transform: uppercase; }
  .fig .t-callout   { font-family: var(--mono); font-size: 26px; fill: var(--fg); font-weight: 500; letter-spacing: 0.02em; }

  .fig .strike-line      { stroke: var(--accent); fill: none; stroke-dasharray: 8 5; stroke-width: 2.2; }
  .fig .strike-line-thin { stroke: var(--accent); fill: none; stroke-dasharray: 6 4; stroke-width: 1.6; }

  /* In-article iframe overrides */
  html, body { background: var(--bg); }
  body.variant { padding: 0; border-bottom: 0; }
  .figure-wrap { border: 0; max-width: none; }
  svg.fig { width: 100%; height: auto; display: block; }
</style>
</head>
<body id="figure-host" class="variant">
  <div class="figure-wrap" id="wrap"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, children = []) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  }
  return n;
};
const text = (x, y, str, cls, extra = {}) => el('text', { x, y, class: cls, ...extra }, str);
const txw = (s, size) => s.length * size * 0.55; // sans width approximation

/* ============================================================
   Geometry
   ============================================================ */
const W = 1600, H = 900;
const MAIN_X1 = 50, MAIN_X2 = 1380;
const RAIL_X1 = 1410, RAIL_X2 = 1560;

const L1_Y = 110, L1_H = 200;   // query card
const L2_Y = 360, L2_H = 84;    // metadata pills
const L3_Y = 490, L3_H = 160;   // stage cards
const L4_Y = 720, L4_H = 80;    // corpus

const COL_CENTERS = [195, 525, 855, 1185];
const PILL_W = 280, STAGE_W = 300;
const STRIKE_COL = 1; // column 2 — affiliation

/* ============================================================
   Data
   ============================================================ */
const COLUMNS = [
  { id: 'M1', pill: 'LINGUISTIC DEPTH',  stageN: 'S3', stageTitle: 'ANALYSIS',   bullet: 'lexicon · sentiment' },
  { id: 'M2', pill: 'AUTHOR AFFILIATION', stageN: 'S2', stageTitle: 'ENRICHMENT', bullet: 'OpenAlex · Semantic Scholar' },
  { id: 'M3', pill: 'CITATION DEPTH',    stageN: 'S3', stageTitle: 'ANALYSIS',   bullet: 'citation graph' },
  { id: 'M4', pill: 'PAPER IDENTITY',    stageN: 'S4', stageTitle: 'INGESTION',  bullet: 'LightRAG embeddings' },
];

const RAIL = [
  { n: '01', y: 200, title: 'QUESTION' },
  { n: '02', y: 400, title: 'SIGNALS' },
  { n: '03', y: 570, title: 'PROVENANCE' },
  { n: '04', y: 760, title: 'SOURCE' },
];

/* ============================================================
   Defs
   ============================================================ */
function buildDefs() {
  const defs = el('defs');
  const make = (id, cls, size = 8) => {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: size, markerHeight: size, orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M0,1 L10,5 L0,9 Z', class: cls }));
    defs.appendChild(m);
  };
  make('arr-mid', 'ink-muted');
  make('arr-acc', 'acc-f', 9);
  return defs;
}

/* ============================================================
   Top title strip
   ============================================================ */
function buildChrome(svg) {
  svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' }));
  svg.appendChild(text(MAIN_X1, 58, 'BACKWARD DEPENDENCY TRACE', 't-title'));
  svg.appendChild(text(RAIL_X2, 58, 'ONE QUERY · FOUR UPSTREAM DEBTS', 't-cap', { 'text-anchor': 'end' }));
  svg.appendChild(el('line', { x1: MAIN_X1, y1: 78, x2: RAIL_X2, y2: 78, class: 'hair', 'stroke-width': 1 }));
}

/* ============================================================
   Right rail
   ============================================================ */
function buildRail(svg) {
  svg.appendChild(el('line', { x1: RAIL_X1, y1: 100, x2: RAIL_X1, y2: 820, class: 'hair', 'stroke-width': 1 }));
  for (const r of RAIL) {
    svg.appendChild(el('line', { x1: MAIN_X2 + 8, y1: r.y, x2: RAIL_X1, y2: r.y, class: 'hair', 'stroke-width': 1 }));
    svg.appendChild(text(RAIL_X1 + 14, r.y - 4, r.n, 't-rail-n'));
    svg.appendChild(text(RAIL_X1 + 14, r.y + 22, r.title, 't-rail-t'));
  }
}

/* ============================================================
   Layer 1 — Query card
   ============================================================ */
function buildQuery(svg) {
  const x = 100, y = L1_Y, w = 1180, h = L1_H;

  svg.appendChild(el('rect', { x: x + 8, y: y + 12, width: w, height: h, fill: 'color-mix(in srgb, var(--fg) 5%, transparent)' }));
  svg.appendChild(el('rect', { x, y, width: w, height: h, class: 'acc-soft' }));
  svg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'none', class: 'acc-s', 'stroke-width': 1.2 }));
  svg.appendChild(el('rect', { x, y, width: 6, height: h, class: 'acc-f' }));

  // Eyebrow
  svg.appendChild(text(x + 24, y + 38, 'L1 · AN ANALYST ASKS', 't-cap', { fill: 'var(--accent-ink)' }));

  // Three-line query at 38px sans
  const QS = 38;
  const lines = [
    [['Find papers with ', false], ['HIGH LINGUISTIC DEPTH,', true]],
    [['cited by ', false], ['TOP-TIER AUTHORS,', true]],
    [['but with ', false], ['FEW CITATIONS.', true]],
  ];
  const baseY = y + 86;
  const lineGap = 50;
  for (let li = 0; li < lines.length; li++) {
    const ly = baseY + li * lineGap;
    let cx = x + 24;
    for (const seg of lines[li]) {
      const [str, em] = seg;
      const w = txw(str, QS);
      if (em) {
        svg.appendChild(el('rect', { x: cx - 4, y: ly - 32, width: w + 8, height: 44, class: 'acc-medium' }));
        svg.appendChild(text(cx, ly, str, 't-quote-em'));
      } else {
        svg.appendChild(text(cx, ly, str, 't-quote'));
      }
      cx += w;
    }
  }
}

/* ============================================================
   Layer 2 — Metadata pills
   ============================================================ */
function buildPills(svg) {
  COLUMNS.forEach((col, i) => {
    const cx = COL_CENTERS[i];
    const x = cx - PILL_W / 2, y = L2_Y, w = PILL_W, h = L2_H;
    const struck = (i === STRIKE_COL);

    svg.appendChild(el('rect', { x: x + 4, y: y + 6, width: w, height: h, fill: 'color-mix(in srgb, var(--fg) 4%, transparent)' }));
    svg.appendChild(el('rect', { x, y, width: w, height: h, class: struck ? 'acc-soft' : 'neutral-fill' }));
    svg.appendChild(el('rect', {
      x, y, width: w, height: h, fill: 'none',
      stroke: struck ? 'var(--accent)' : 'var(--hairline-strong)',
      'stroke-width': struck ? 1.4 : 1,
      'stroke-dasharray': struck ? '6 4' : null,
    }));
    svg.appendChild(el('rect', { x, y, width: 5, height: h, fill: struck ? 'var(--accent)' : 'var(--hairline-strong)' }));

    svg.appendChild(text(x + 16, y + 30, `M${i + 1}`, 't-cap', { fill: struck ? 'var(--accent-ink)' : 'var(--fg-faint)' }));
    svg.appendChild(text(x + 16, y + 60, col.pill, 't-pill', { fill: struck ? 'var(--accent-ink)' : 'var(--fg)' }));

    if (struck) {
      svg.appendChild(el('line', { x1: x + 10, y1: y + 54, x2: x + w - 10, y2: y + 54, class: 'strike-line-thin' }));
    }
  });
}

/* ============================================================
   Layer 3 — Stage cards
   ============================================================ */
function buildStages(svg) {
  COLUMNS.forEach((col, i) => {
    const cx = COL_CENTERS[i];
    const x = cx - STAGE_W / 2, y = L3_Y, w = STAGE_W, h = L3_H;
    const struck = (i === STRIKE_COL);

    svg.appendChild(el('rect', { x: x + 4, y: y + 6, width: w, height: h, fill: 'color-mix(in srgb, var(--fg) 5%, transparent)' }));
    svg.appendChild(el('rect', { x, y, width: w, height: h, class: 'neutral-fill' }));
    svg.appendChild(el('rect', {
      x, y, width: w, height: h, fill: 'none',
      stroke: struck ? 'var(--accent)' : 'var(--hairline-strong)',
      'stroke-width': struck ? 1.4 : 1,
      'stroke-dasharray': struck ? '6 4' : null,
    }));

    // header strip
    svg.appendChild(el('rect', { x, y, width: w, height: 44, class: struck ? 'acc-medium' : 'neutral-fill-2' }));
    svg.appendChild(el('line', { x1: x, y1: y + 44, x2: x + w, y2: y + 44, class: 'hair-s', 'stroke-width': 1 }));

    svg.appendChild(text(x + 16, y + 30, col.stageN, 't-cap', { fill: struck ? 'var(--accent-ink)' : 'var(--fg)' }));
    svg.appendChild(text(x + 64, y + 30, col.stageTitle, 't-cap', { fill: struck ? 'var(--accent-ink)' : 'var(--fg-muted)' }));

    svg.appendChild(text(x + 16, y + 82, col.bullet, 't-stage-body', { fill: struck ? 'var(--accent-ink)' : 'var(--fg-muted)' }));

    if (struck) {
      svg.appendChild(el('line', {
        x1: x - 8, y1: y + h + 8, x2: x + w + 8, y2: y - 8, class: 'strike-line',
      }));
    }
  });
}

/* ============================================================
   Layer 4 — Corpus
   ============================================================ */
function buildCorpus(svg) {
  const x = MAIN_X1, y = L4_Y, w = MAIN_X2 - MAIN_X1, h = L4_H;
  svg.appendChild(el('rect', { x, y, width: w, height: h, class: 'neutral-fill' }));
  svg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'none', class: 'hair-s', 'stroke-width': 1 }));

  svg.appendChild(text(x + 22, y + 32, 'L4 · SOURCE', 't-cap'));
  svg.appendChild(text(x + 22, y + 64, '4,000+ ACADEMIC PAPERS · RAW PDFs', 't-title'));

  // page glyphs at right
  const glyphStart = x + 720, glyphEnd = x + w - 22, glyphCount = 50;
  const step = (glyphEnd - glyphStart) / glyphCount;
  for (let i = 0; i < glyphCount; i++) {
    svg.appendChild(el('rect', { x: glyphStart + i * step, y: y + 28, width: step * 0.55, height: 36, fill: 'var(--hairline-strong)', opacity: 0.55 }));
  }
}

/* ============================================================
   Connectors
   ============================================================ */
function buildConnectors(svg) {
  const queryBottomY = L1_Y + L1_H;
  const pillTopY = L2_Y;
  const pillBottomY = L2_Y + L2_H;
  const stageTopY = L3_Y;
  const stageBottomY = L3_Y + L3_H;
  const corpusTopY = L4_Y;
  const queryCenter = 100 + 1180 / 2;

  // Query → pills (splay)
  COLUMNS.forEach((col, i) => {
    const struck = (i === STRIKE_COL);
    const cx = COL_CENTERS[i];
    const midY = (queryBottomY + pillTopY) / 2;
    svg.appendChild(el('path', {
      d: `M ${queryCenter} ${queryBottomY} C ${queryCenter} ${midY} ${cx} ${midY} ${cx} ${pillTopY - 2}`,
      fill: 'none',
      stroke: struck ? 'var(--accent)' : 'var(--hairline-strong)',
      'stroke-width': struck ? 2 : 1.2,
      'stroke-dasharray': struck ? '6 4' : null,
      'marker-end': struck ? 'url(#arr-acc)' : 'url(#arr-mid)',
    }));
  });

  // Pills → stages (vertical)
  COLUMNS.forEach((col, i) => {
    const struck = (i === STRIKE_COL);
    const cx = COL_CENTERS[i];
    svg.appendChild(el('path', {
      d: `M ${cx} ${pillBottomY + 2} L ${cx} ${stageTopY - 2}`,
      fill: 'none',
      stroke: struck ? 'var(--accent)' : 'var(--hairline-strong)',
      'stroke-width': struck ? 2 : 1.2,
      'stroke-dasharray': struck ? '6 4' : null,
      'marker-end': struck ? 'url(#arr-acc)' : 'url(#arr-mid)',
    }));
  });

  // Stages → corpus — skip the struck column (data path broken)
  COLUMNS.forEach((col, i) => {
    if (i === STRIKE_COL) return;
    const cx = COL_CENTERS[i];
    svg.appendChild(el('path', {
      d: `M ${cx} ${stageBottomY + 2} L ${cx} ${corpusTopY - 2}`,
      fill: 'none', stroke: 'var(--hairline-strong)', 'stroke-width': 1.2,
      'marker-end': 'url(#arr-mid)',
    }));
  });
}

/* ============================================================
   Counterfactual callout
   ============================================================ */
function buildStrikeCallout(svg) {
  const cx = COL_CENTERS[STRIKE_COL];
  const stageBottomY = L3_Y + L3_H;
  const w = 360, h = 56;
  const x = cx - w / 2, y = stageBottomY + 14;

  svg.appendChild(el('line', {
    x1: cx, y1: stageBottomY + 2, x2: cx, y2: y - 1,
    stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-dasharray': '6 4', fill: 'none',
  }));

  svg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'var(--bg)' }));
  svg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 1.4, 'stroke-dasharray': '6 4' }));
  svg.appendChild(el('rect', { x, y, width: 5, height: h, class: 'acc-f' }));

  svg.appendChild(text(x + 16, y + 22, 'COUNTERFACTUAL', 't-callout-h'));
  svg.appendChild(text(x + 16, y + 46, 'DROP S2 → QUERY BREAKS.', 't-callout'));
}

/* ============================================================
   Build
   ============================================================ */
function buildSVG() {
  const svg = el('svg', { class: 'fig', viewBox: `0 0 ${W} ${H}`, xmlns: NS, preserveAspectRatio: 'xMidYMid meet' });
  svg.appendChild(buildDefs());
  buildChrome(svg);
  buildRail(svg);
  buildQuery(svg);
  buildConnectors(svg);
  buildPills(svg);
  buildStages(svg);
  buildCorpus(svg);
  buildStrikeCallout(svg);
  return svg;
}

document.getElementById('wrap').appendChild(buildSVG());

const host = document.getElementById('figure-host');
const mq = matchMedia('(prefers-color-scheme: dark)');
const setTheme = (t) => { host.dataset.theme = t; };
setTheme(mq.matches ? 'dark' : 'light');
mq.addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'theme' && (d.theme === 'dark' || d.theme === 'light')) setTheme(d.theme);
});
</script>
</body>
</html>
