<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fig 03 — Strategic geometry of retrieval</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.003 80);
    --bg-sub: oklch(0.965 0.004 80);
    --fg: oklch(0.18 0.01 270);
    --fg-muted: oklch(0.46 0.006 270);
    --fg-faint: oklch(0.62 0.005 270);
    --hairline: oklch(0.86 0.005 80);
    --hairline-strong: oklch(0.74 0.006 80);

    --accent:        oklch(0.58 0.16 28);
    --accent-soft:   oklch(0.58 0.16 28 / 0.12);
    --accent-medium: oklch(0.58 0.16 28 / 0.24);
    --accent-ink:    oklch(0.46 0.18 28);

    --consensus:      oklch(0.48 0.03 260);
    --consensus-soft: oklch(0.48 0.03 260 / 0.12);

    --noise: oklch(0.78 0.005 80);

    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: oklch(0.16 0.008 270);
    --bg-sub: oklch(0.20 0.008 270);
    --fg: oklch(0.96 0.003 80);
    --fg-muted: oklch(0.70 0.005 80);
    --fg-faint: oklch(0.48 0.005 80);
    --hairline: oklch(0.28 0.008 270);
    --hairline-strong: oklch(0.42 0.008 270);

    --accent:        oklch(0.72 0.17 28);
    --accent-soft:   oklch(0.72 0.17 28 / 0.18);
    --accent-medium: oklch(0.72 0.17 28 / 0.34);
    --accent-ink:    oklch(0.82 0.16 28);

    --consensus:      oklch(0.72 0.04 260);
    --consensus-soft: oklch(0.72 0.04 260 / 0.14);

    --noise: oklch(0.36 0.005 270);
  }

  html, body { margin: 0; background: var(--bg-sub); color: var(--fg); font-family: var(--sans); }
  .variant { padding: 28px clamp(20px, 4vw, 64px) 48px; background: var(--bg); border-bottom: 1px solid var(--hairline); }
  .variant-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
  .variant-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .variant-head .meta { color: var(--fg-faint); margin-left: auto; }
  .figure-wrap { border: 1px solid var(--hairline); background: var(--bg); max-width: 1600px; }
  svg.fig { width: 100%; height: auto; display: block; }

  .fig .hair    { stroke: var(--hairline); fill: none; }
  .fig .hair-s  { stroke: var(--hairline-strong); fill: none; }
  .fig .ink     { fill: var(--fg); }
  .fig .ink-muted { fill: var(--fg-muted); }
  .fig .ink-faint { fill: var(--fg-faint); }

  .fig .acc-f      { fill: var(--accent); }
  .fig .acc-s      { stroke: var(--accent); fill: none; }
  .fig .acc-ink    { fill: var(--accent-ink); }
  .fig .acc-soft   { fill: var(--accent-soft); }
  .fig .acc-medium { fill: var(--accent-medium); }

  .fig .con-f      { fill: var(--consensus); }
  .fig .con-s      { stroke: var(--consensus); fill: none; }
  .fig .con-soft   { fill: var(--consensus-soft); }

  /* Type — mobile floor 22px */
  .fig text { font-family: var(--mono); fill: var(--fg); }
  .fig .t-title    { font-family: var(--mono); font-size: 30px; letter-spacing: 0.04em; fill: var(--fg); font-weight: 500; }
  .fig .t-cap      { font-family: var(--mono); font-size: 22px; letter-spacing: 0.08em; fill: var(--fg-muted); text-transform: uppercase; }
  .fig .t-num      { font-family: var(--mono); font-size: 22px; letter-spacing: 0.02em; fill: var(--fg-muted); font-feature-settings: "tnum"; }
  .fig .t-axis     { font-family: var(--mono); font-size: 26px; letter-spacing: 0.10em; fill: var(--fg-muted); text-transform: uppercase; }
  .fig .t-zone     { font-family: var(--mono); font-size: 30px; letter-spacing: 0.06em; fill: var(--fg); text-transform: uppercase; font-weight: 500; }
  .fig .t-zone-acc { font-family: var(--mono); font-size: 30px; letter-spacing: 0.06em; fill: var(--accent-ink); text-transform: uppercase; font-weight: 600; }
  .fig .t-zone-sub { font-family: var(--mono); font-size: 22px; fill: var(--fg-muted); letter-spacing: 0.02em; }
  .fig .t-callout-h{ font-family: var(--mono); font-size: 22px; letter-spacing: 0.10em; fill: var(--accent-ink); text-transform: uppercase; }
  .fig .t-callout  { font-family: var(--sans); font-size: 30px; letter-spacing: -0.005em; fill: var(--fg); font-weight: 400; }
  .fig .t-callout-em { font-family: var(--sans); font-size: 30px; letter-spacing: -0.005em; fill: var(--accent-ink); font-weight: 600; }
  .fig .t-filter   { font-family: var(--mono); font-size: 22px; letter-spacing: 0.04em; fill: var(--fg); font-weight: 500; }
  .fig .t-filter-sub { font-family: var(--mono); font-size: 20px; fill: var(--fg-muted); letter-spacing: 0.02em; }

  .fig .dot-noise     { fill: var(--noise); opacity: 0.55; }
  .fig .dot-bg        { fill: var(--fg-faint); opacity: 0.45; }
  .fig .dot-consensus { fill: var(--consensus); opacity: 0.78; }
  .fig .dot-alpha     { fill: var(--accent); opacity: 1; }

  /* In-article iframe overrides */
  html, body { background: var(--bg); }
  body.variant { padding: 0; border-bottom: 0; }
  .figure-wrap { border: 0; max-width: none; }
  svg.fig { width: 100%; height: auto; display: block; }
</style>
</head>
<body id="figure-host" class="variant">
  <div class="figure-wrap" id="wrap"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, children = []) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  }
  return n;
};
const text = (x, y, str, cls, extra = {}) => el('text', { x, y, class: cls, ...extra }, str);

const W = 1600, H = 900;
const PLOT_X1 = 130, PLOT_X2 = 1080;
const PLOT_Y1 = 130, PLOT_Y2 = 740;
const PLOT_W = PLOT_X2 - PLOT_X1, PLOT_H = PLOT_Y2 - PLOT_Y1;
const LOG_MIN = 0, LOG_MAX = 4;

const toX = (l) => PLOT_X1 + ((l - LOG_MIN) / (LOG_MAX - LOG_MIN)) * PLOT_W;
const toY = (q) => PLOT_Y2 - q * PLOT_H;

function makeRnd(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function gauss(rnd, mean, std) {
  let u1 = rnd(); if (u1 < 1e-7) u1 = 1e-7;
  const u2 = rnd();
  return mean + Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2) * std;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function buildDefs() {
  const defs = el('defs');
  const clip = el('clipPath', { id: 'plot-clip' });
  clip.appendChild(el('rect', { x: PLOT_X1, y: PLOT_Y1, width: PLOT_W, height: PLOT_H }));
  defs.appendChild(clip);

  const hatch = el('pattern', { id: 'noise-hatch', patternUnits: 'userSpaceOnUse', width: 8, height: 8, patternTransform: 'rotate(45)' });
  hatch.appendChild(el('rect', { width: 8, height: 8, fill: 'var(--noise)', opacity: 0.10 }));
  hatch.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'var(--noise)', 'stroke-width': 1, opacity: 0.50 }));
  defs.appendChild(hatch);

  return defs;
}

function buildChrome(svg) {
  svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' }));
  svg.appendChild(text(50, 58, 'STRATEGIC GEOMETRY OF RETRIEVAL', 't-title'));
  svg.appendChild(text(1550, 58, '4,000+ PAPERS · CITATION × QUALITY', 't-cap', { 'text-anchor': 'end' }));
  svg.appendChild(el('line', { x1: 50, y1: 78, x2: 1550, y2: 78, class: 'hair', 'stroke-width': 1 }));
}

function buildAxes(svg) {
  // Plot frame (L + B only)
  svg.appendChild(el('line', { x1: PLOT_X1, y1: PLOT_Y1, x2: PLOT_X1, y2: PLOT_Y2, class: 'hair-s', 'stroke-width': 1.2 }));
  svg.appendChild(el('line', { x1: PLOT_X1, y1: PLOT_Y2, x2: PLOT_X2, y2: PLOT_Y2, class: 'hair-s', 'stroke-width': 1.2 }));

  // X major ticks
  const xTicks = [
    { v: 0, label: '1' },
    { v: 1, label: '10' },
    { v: 2, label: '100' },
    { v: 3, label: '1k' },
    { v: 4, label: '10k+' },
  ];
  // minor ticks
  for (let dec = 0; dec < 4; dec++) {
    for (let m = 2; m <= 9; m++) {
      const x = toX(dec + Math.log10(m));
      svg.appendChild(el('line', { x1: x, y1: PLOT_Y2, x2: x, y2: PLOT_Y2 + 5, class: 'hair', 'stroke-width': 1 }));
    }
  }
  for (const t of xTicks) {
    const x = toX(t.v);
    svg.appendChild(el('line', { x1: x, y1: PLOT_Y2, x2: x, y2: PLOT_Y2 + 12, class: 'hair-s', 'stroke-width': 1.2 }));
    svg.appendChild(text(x, PLOT_Y2 + 38, t.label, 't-num', { 'text-anchor': 'middle' }));
    svg.appendChild(el('line', { x1: x, y1: PLOT_Y1, x2: x, y2: PLOT_Y2, class: 'hair', 'stroke-width': 1, opacity: 0.4 }));
  }

  // Y ticks
  const yTicks = [
    { v: 0,   label: 'LOW' },
    { v: 0.5, label: 'MID' },
    { v: 1,   label: 'HIGH' },
  ];
  for (const t of yTicks) {
    const y = toY(t.v);
    svg.appendChild(el('line', { x1: PLOT_X1 - 12, y1: y, x2: PLOT_X1, y2: y, class: 'hair-s', 'stroke-width': 1.2 }));
    svg.appendChild(text(PLOT_X1 - 18, y + 8, t.label, 't-num', { 'text-anchor': 'end' }));
    svg.appendChild(el('line', { x1: PLOT_X1, y1: y, x2: PLOT_X2, y2: y, class: 'hair', 'stroke-width': 1, opacity: 0.4 }));
  }

  // Axis titles
  svg.appendChild(text(PLOT_X1, PLOT_Y2 + 76, 'X · CITATION COUNT', 't-axis'));
  svg.appendChild(text(PLOT_X2, PLOT_Y2 + 76, 'MORE CITED →', 't-cap', { 'text-anchor': 'end', fill: 'var(--fg-muted)' }));

  svg.appendChild(text(56, PLOT_Y1 - 16, 'Y · QUALITY SIGNALS', 't-axis'));
}

function buildDots(svg) {
  const g = el('g', { 'clip-path': 'url(#plot-clip)' });
  const rnd = makeRnd(20260526);

  const dists = [
    { n: 1450, cite: { m: 0.30, s: 0.50 }, qual: { m: 0.08, s: 0.09 }, cls: 'dot-noise', r: () => 1.4 + rnd() * 0.8 },
    { n: 700,  cite: { m: 1.80, s: 0.95 }, qual: { m: 0.42, s: 0.18 }, cls: 'dot-bg',    r: () => 1.4 + rnd() * 0.8 },
    { n: 1650, cite: { m: 3.05, s: 0.35 }, qual: { m: 0.55, s: 0.13 }, cls: 'dot-consensus', r: () => 1.6 + rnd() * 0.9 },
    { n: 380,  cite: { m: 2.70, s: 0.45 }, qual: { m: 0.32, s: 0.10 }, cls: 'dot-bg',    r: () => 1.3 + rnd() * 0.6 },
    { n: 115,  cite: { m: 0.75, s: 0.30 }, qual: { m: 0.82, s: 0.07 }, cls: 'dot-alpha', r: () => 2.6 + rnd() * 1.1 },
    { n: 220,  cite: { m: 1.90, s: 1.10 }, qual: { m: 0.70, s: 0.10 }, cls: 'dot-bg',    r: () => 1.3 + rnd() * 0.6 },
  ];

  for (const d of dists) {
    for (let i = 0; i < d.n; i++) {
      const lc = gauss(rnd, d.cite.m, d.cite.s);
      const q  = gauss(rnd, d.qual.m, d.qual.s);
      if (lc < -0.4 || lc > 4.4 || q < -0.05 || q > 1.05) continue;
      g.appendChild(el('circle', {
        cx: toX(clamp(lc, -0.4, 4.4)).toFixed(1),
        cy: toY(clamp(q, -0.05, 1.05)).toFixed(1),
        r: d.r().toFixed(2),
        class: d.cls,
      }));
    }
  }
  // sprinkle deep-alpha stragglers
  for (let i = 0; i < 14; i++) {
    const lc = gauss(rnd, 0.6, 0.45);
    const q  = gauss(rnd, 0.88, 0.05);
    if (lc < -0.4 || lc > 4.4 || q < 0 || q > 1) continue;
    g.appendChild(el('circle', {
      cx: toX(clamp(lc, -0.4, 4.4)).toFixed(1),
      cy: toY(clamp(q, 0, 1)).toFixed(1),
      r: (2.8 + rnd() * 1.0).toFixed(2),
      class: 'dot-alpha',
    }));
  }

  svg.appendChild(g);
}

function buildZones(svg) {
  // Noise band
  const noisePath = `
    M ${PLOT_X1} ${toY(0.20)}
    C ${toX(0.6)} ${toY(0.22)}, ${toX(1.0)} ${toY(0.18)}, ${toX(1.35)} ${toY(0.14)}
    C ${toX(1.55)} ${toY(0.10)}, ${toX(1.7)} ${toY(0.06)}, ${toX(1.75)} ${toY(0.0)}
    L ${PLOT_X1} ${PLOT_Y2} Z`.replace(/\s+/g, ' ').trim();
  svg.appendChild(el('path', { d: noisePath, fill: 'url(#noise-hatch)', opacity: 0.85, 'clip-path': 'url(#plot-clip)' }));
  svg.appendChild(el('path', { d: noisePath, fill: 'none', stroke: 'var(--noise)', 'stroke-width': 1, 'stroke-dasharray': '5 4', opacity: 0.7, 'clip-path': 'url(#plot-clip)' }));

  // Noise label — single line
  svg.appendChild(text(toX(0.4), toY(0.04), 'NOISE · FILTERED EARLY', 't-cap'));

  // Consensus ellipse
  const ccx = toX(3.05), ccy = toY(0.55);
  const crx = (toX(3.6) - toX(2.45)) / 2;
  const cry = (toY(0.30) - toY(0.78)) / 2;
  svg.appendChild(el('ellipse', { cx: ccx, cy: ccy, rx: crx, ry: cry, class: 'con-soft' }));
  svg.appendChild(el('ellipse', { cx: ccx, cy: ccy, rx: crx, ry: cry, fill: 'none', stroke: 'var(--consensus)', 'stroke-width': 1.4, 'stroke-dasharray': '6 4', opacity: 0.85 }));

  // Consensus label — BELOW, centered with opaque backing
  const cLabelY = ccy + cry + 38;
  svg.appendChild(el('rect', { x: ccx - 220, y: cLabelY - 28, width: 440, height: 64, fill: 'var(--bg)', opacity: 0.94 }));
  svg.appendChild(el('line', {
    x1: ccx, y1: ccy + cry - 2, x2: ccx, y2: cLabelY - 28,
    stroke: 'var(--consensus)', 'stroke-width': 1, 'stroke-dasharray': '3 4', opacity: 0.7,
  }));
  svg.appendChild(text(ccx, cLabelY, 'CONSENSUS ZONE', 't-zone', { 'text-anchor': 'middle' }));
  svg.appendChild(text(ccx, cLabelY + 28, 'where standard RAG looks', 't-zone-sub', { 'text-anchor': 'middle' }));

  // Alpha ellipse
  const acx = toX(0.75), acy = toY(0.82);
  const arx = (toX(1.45) - toX(0.05)) / 2;
  const ary = (toY(0.72) - toY(0.92)) / 2;
  svg.appendChild(el('ellipse', { cx: acx, cy: acy, rx: arx, ry: ary, class: 'acc-soft' }));
  svg.appendChild(el('ellipse', { cx: acx, cy: acy, rx: arx, ry: ary, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-dasharray': '6 4' }));

  // Alpha label — to the right of ellipse
  const aLabelX = acx + arx + 20;
  const aLabelY = acy - 14;
  svg.appendChild(el('line', { x1: acx + arx - 4, y1: acy, x2: aLabelX - 8, y2: aLabelY + 4, class: 'acc-s', 'stroke-width': 1.5 }));
  svg.appendChild(text(aLabelX, aLabelY, 'ALPHA ZONE', 't-zone-acc'));
  svg.appendChild(text(aLabelX, aLabelY + 30, 'where this pipeline looks', 't-zone-sub', { fill: 'var(--accent-ink)' }));

  return { acx: acx + arx - 4, acy };
}

function buildCallout(svg, alphaAnchor) {
  const x = 1110, y = 140, w = 440, h = 540;

  svg.appendChild(el('rect', { x: x + 6, y: y + 8, width: w, height: h, fill: 'color-mix(in srgb, var(--fg) 5%, transparent)' }));
  svg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'var(--bg-sub)' }));
  svg.appendChild(el('rect', { x, y, width: w, height: h, fill: 'none', class: 'acc-s', 'stroke-width': 1.4 }));
  svg.appendChild(el('rect', { x, y, width: 5, height: h, class: 'acc-f' }));

  svg.appendChild(text(x + 20, y + 36, 'WHY THIS PIPELINE EXISTS', 't-callout-h'));

  // Three-line headline
  svg.appendChild(text(x + 20, y + 88, 'Recover signal from', 't-callout'));
  svg.appendChild(text(x + 20, y + 124, 'the alpha zone — where', 't-callout'));
  svg.appendChild(text(x + 20, y + 160, 'consensus stops looking.', 't-callout-em'));

  svg.appendChild(el('line', { x1: x + 20, y1: y + 200, x2: x + w - 20, y2: y + 200, class: 'hair', 'stroke-width': 1 }));

  svg.appendChild(text(x + 20, y + 230, 'FILTERS ON LIGHTRAG', 't-cap'));

  const filters = [
    { tag: 'F1', name: 'LINGUISTIC DEPTH',     sub: 'lexicon · sentiment' },
    { tag: 'F2', name: 'AUTHOR AFFILIATION',   sub: 'top-tier · h-index' },
    { tag: 'F3', name: 'CITATION DEPTH',       sub: 'graph centrality' },
  ];
  let fy = y + 264;
  for (const f of filters) {
    svg.appendChild(el('line', { x1: x + 20, y1: fy - 2, x2: x + 20, y2: fy + 60, class: 'acc-s', 'stroke-width': 3 }));
    svg.appendChild(text(x + 38, fy + 18, f.tag, 't-cap', { fill: 'var(--accent-ink)' }));
    svg.appendChild(text(x + 86, fy + 18, f.name, 't-filter'));
    svg.appendChild(text(x + 86, fy + 46, f.sub, 't-filter-sub'));
    fy += 80;
  }

  // Connector from alpha zone to callout
  const tx = x;
  const ty = y + 100;
  const midX = (alphaAnchor.acx + tx) / 2;
  svg.appendChild(el('path', {
    d: `M ${alphaAnchor.acx} ${alphaAnchor.acy} C ${midX} ${alphaAnchor.acy}, ${midX} ${ty}, ${tx - 4} ${ty}`,
    fill: 'none', stroke: 'var(--accent)', 'stroke-width': 1.8, 'stroke-dasharray': '6 4',
  }));
  svg.appendChild(el('circle', { cx: alphaAnchor.acx, cy: alphaAnchor.acy, r: 4, class: 'acc-f' }));
  svg.appendChild(el('circle', { cx: tx - 4, cy: ty, r: 4, class: 'acc-f' }));
}

function buildSVG() {
  const svg = el('svg', { class: 'fig', viewBox: `0 0 ${W} ${H}`, xmlns: NS, preserveAspectRatio: 'xMidYMid meet' });
  svg.appendChild(buildDefs());
  buildChrome(svg);
  buildAxes(svg);
  buildDots(svg);
  const alphaAnchor = buildZones(svg);
  buildCallout(svg, alphaAnchor);
  return svg;
}

document.getElementById('wrap').appendChild(buildSVG());

const host = document.getElementById('figure-host');
const mq = matchMedia('(prefers-color-scheme: dark)');
const setTheme = (t) => { host.dataset.theme = t; };
setTheme(mq.matches ? 'dark' : 'light');
mq.addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'theme' && (d.theme === 'dark' || d.theme === 'light')) setTheme(d.theme);
});
</script>
</body>
</html>
